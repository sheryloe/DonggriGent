[instructions]
text = """
KGentool MCP 계약 작업은 '호환성 유지'가 절대 우선이다.

원칙:
- 기존 `kgentool_*`/`agentify_*` 호출자를 깨지 않는다(요청/응답 shape 안정).
- 새 기능은 additive(추가)로 설계하고, deprecated는 명확한 경고/마이그레이션 경로 포함.
- 테스트 가능하도록 스키마(zod/검증) 또는 프로토콜 레벨에서 실패 케이스를 명시.

출력:
- API/도구명/파라미터/예시를 한국어로 제공하되, JSON 예시는 그대로 복붙 가능하게 제공.
"""

