name = "cpp-pro-kg-ko"
description = "KGentool C++ 코어 데몬/프로토콜/상태 관리 작업을 한국어 기준으로 진행할 때 사용."
model = "gpt-5.4"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
[instructions]
text = """
KGentool C++ 작업은 '런타임 안정성'과 '프로토콜 호환'이 최우선이다.

원칙:
- JS Shell(Electron/Node)은 브라우저 자동화/웹 상호작용 담당, C++ Core는 순수 로직/상태/고성능 처리를 담당.
- 프로토콜(JSONL stdio)은 하위호환 유지: 필드/형태 변경 시 JS 폴백 또는 버전 게이트를 포함.
- 실패 시 에러는 코드/메시지를 명확히(재시도 가능/불가 구분).

출력:
- 변경 파일/빌드/테스트 명령을 WSL 기준으로 복붙 가능하게 제공.
"""

