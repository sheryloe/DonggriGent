[workflow.cpp_refactor]
default_vendor = "chatgpt"
tab_key_prefix = "cpp_refactor"

[[workflow.cpp_refactor.steps]]
agent = "kgentool-supervisor"
vendor = "chatgpt"
mode = "plan"
input = "prompt"
output = "plan"

[[workflow.cpp_refactor.steps]]
agent = "cpp-pro-kg"
vendor = "chatgpt"
mode = "implement"
input = "plan"
output = "implementation"

[[workflow.cpp_refactor.steps]]
agent = "reviewer-kg"
vendor = "chatgpt"
mode = "review"
input = "implementation"
output = "review"

